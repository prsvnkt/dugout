name: Bug report
description: Something in Dugout does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project…
        2. Split the terminal…
    validations:
      required: true
  - type: input
    id: dugout-version
    attributes:
      label: Dugout version or commit
      placeholder: 0.1.0, or the output of `git rev-parse --short HEAD`
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version and chip
      placeholder: macOS 26.1, Apple M3
    validations:
      required: true
  - type: input
    id: agent-version
    attributes:
      label: Agent and version
      placeholder: e.g. Claude Code 2.1.0 (`claude --version`), Codex 0.50.0 (`codex --version`)
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Remove tokens, paths or anything else private first.
