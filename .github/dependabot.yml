version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned on purpose (see Gotchas in .claude/CLAUDE.md): electron-vite 5 needs Vite 7, and
      # typescript-eslint does not support newer TypeScript yet.
      - dependency-name: vite
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]
      # Its next major needs Vite 8, so it moves together with the Vite pin above.
      - dependency-name: '@vitejs/plugin-react'
        update-types: [version-update:semver-major]
      # Types must match the Node the project runs on (.nvmrc), not the newest Node.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
