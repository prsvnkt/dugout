name: Release

# Pushing a tag like v0.2.0 builds the macOS app and attaches it to a draft GitHub Release.
# Review the draft's notes, then publish it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      # Bundling Monaco needs more than Node's default heap on the runner.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check the tag matches package.json
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($expected)"
            exit 1
          fi
      # postinstall's install-electron downloads the Electron binary (~110 MB) into this cache.
      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/electron
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      # Tags are not protected, so a tag on a broken commit must fail here rather than ship.
      # The e2e tests are left to CI on main: they would double the release time.
      - run: npm run check
      - run: npm run dist -- --publish never
      - name: Write SHA256SUMS
        working-directory: dist
        run: shasum -a 256 *.dmg *.zip > SHA256SUMS
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.zip dist/SHA256SUMS
          --draft --generate-notes --title "Dugout $GITHUB_REF_NAME"
